name: Build Redline APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.6 }
      - name: Build
        run: |
          unzip -q -o Redline-project.zip -d src
          cd "$(dirname "$(find src -name settings.gradle.kts | head -1)")"
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/Redline-debug.apk "$GITHUB_WORKSPACE/Redline.apk"
      - uses: actions/upload-artifact@v4
        with: { name: Redline-apk, path: Redline.apk }
